name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    # Bound the job: the native test runner can deadlock at process exit on
    # some suites, and an unbounded hang would otherwise consume the full
    # default job limit before failing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up March
        uses: march-language/setup-march@main

      # blake3 is a dynamic dependency of the march binary.  setup-march builds
      # it during a cache miss (into /tmp/blake3) but does not persist the system
      # library across cache hits, so we install it unconditionally after setup.
      - name: Install blake3 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3-ci
          cd /tmp/blake3-ci/c
          cc -shared -fPIC -O2 -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo install -m 755 libblake3.so /usr/local/lib/libblake3.so
          sudo ldconfig

      - name: Install blake3 (macOS)
        if: runner.os == 'macOS'
        run: brew install blake3

      # `forge build` does not resolve dependencies — with an empty CAS on a
      # fresh runner, depot is simply absent and every module it provides
      # reports as unknown ("Unknown module `Pool`. Did you mean `Plot`?").
      - name: Resolve dependencies
        run: forge deps

      - name: Build
        run: forge build

      - name: Test
        run: forge test
