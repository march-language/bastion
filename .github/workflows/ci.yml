name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    # Bound the job: the native test runner can deadlock at process exit on
    # some suites, and an unbounded hang would otherwise consume the full
    # default job limit before failing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install blake3 (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libblake3-dev

      - name: Install blake3 (macOS)
        if: runner.os == 'macOS'
        run: brew install blake3

      - name: Set up March
        uses: march-language/setup-march@main

      - name: Build
        run: forge build

      - name: Test
        run: forge test
