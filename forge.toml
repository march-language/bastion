[package]
name = "bastion"
version = "0.1.0"
type = "lib"
description = ""
author = ""

[archive.task.bastion.new]
command = "bastion.new"
module  = "lib/forge/new.march"
doc     = "Scaffold a new Bastion application"

[archive.task.bastion.server]
command = "bastion.server"
module  = "lib/forge/server.march"
doc     = "Start the development server with live reload"

[archive.task.bastion.routes]
command = "bastion.routes"
module  = "lib/forge/routes.march"
doc     = "Print the application route table"

[archive.task.bastion.assets]
command = "bastion.assets"
module  = "lib/forge/assets.march"
doc     = "Build and fingerprint static assets"

[archive.task.bastion.gen.auth]
command = "bastion.gen.auth"
module  = "lib/forge/gen_auth.march"
doc     = "Generate authentication boilerplate"

[archive.task.bastion.gen.schema]
command = "bastion.gen.schema"
module  = "lib/forge/gen_schema.march"
doc     = "Generate a database schema module"

[archive.task.bastion.gen.island]
command = "bastion.gen.island"
module  = "lib/forge/gen_island.march"
doc     = "Generate a new WASM island"

[archive.task.bastion.build.islands]
command = "bastion.build.islands"
module  = "lib/forge/build_islands.march"
doc     = "Compile all WASM islands"

[archive.task.bastion.gen.handler]
command = "bastion.gen.handler"
module  = "lib/forge/gen_handler.march"
doc     = "Generate a new request handler"

[archive.task.bastion.gen.context]
command = "bastion.gen.context"
module  = "lib/forge/gen_context.march"
doc     = "Generate a context module"

[archive.task.bastion.gen.channel]
command = "bastion.gen.channel"
module  = "lib/forge/gen_channel.march"
doc     = "Generate a WebSocket channel handler"

[archive.task.bastion.gen.migration]
command = "bastion.gen.migration"
module  = "lib/forge/gen_migration.march"
doc     = "Generate a Depot database migration"

[archive.task.bastion.lower]
command = "bastion.lower"
module  = "lib/forge/lower.march"
doc     = "Lower March templates to plain March"

[archive.task.bastion.depot.migrate]
command = "bastion.depot.migrate"
module  = "lib/forge/depot_migrate.march"
doc     = "Run pending database migrations"

[archive.task.bastion.depot.rollback]
command = "bastion.depot.rollback"
module  = "lib/forge/depot_rollback.march"
doc     = "Roll back the last database migration"

[archive.task.bastion.depot.migrations]
command = "bastion.depot.migrations"
module  = "lib/forge/depot_migrations.march"
doc     = "List all migrations and their status"

[archive.task.bastion.depot.reset]
command = "bastion.depot.reset"
module  = "lib/forge/depot_reset.march"
doc     = "Drop, recreate, and remigrate the database"

[archive.task.bastion.release]
command = "bastion.release"
module  = "lib/forge/release.march"
doc     = "Build a production release"

[archive.task.bastion.console]
command = "bastion.console"
module  = "lib/forge/console.march"
doc     = "Start an interactive console with app context"

[preprocessors]
".march.html" = "bastion lower"

[deps]
depot = { git = "https://github.com/march-language/depot.git", branch = "main" }
